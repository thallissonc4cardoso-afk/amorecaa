  <!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>livia minha princesa ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #ff4e8a, #ff6fa5, #ff8ec7, #ffb3dd);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
    color: white;
    overflow-x: hidden;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.container {
    text-align: center;
    padding: 40px 20px;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 55px;
    margin-bottom: 10px;
}

#contador {
    margin: 20px 0;
    font-weight: 600;
}

/* GALERIA */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    padding: 20px;
    max-width: 900px;
    margin: auto;
}

.gallery img {
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: transform 0.4s ease;
}

.gallery img:hover {
    transform: scale(1.08);
}

/* CORAÇÕES */
.heart {
    position: fixed;
    top: -10px;
    font-size: 18px;
    animation: fall linear forwards;
    opacity: 0.8;
}

@keyframes fall {
    to { transform: translateY(100vh); }
}

iframe {
    display: none;
}
</style>
</head>

<body>

<div class="container">
    <h1>livia e thallisson❤️</h1>
    <h2>Estamos juntos há:</h2>
    <div id="contador"></div>

    <p>
        Desde 27 de abril de 2026,  
        cada momento ao seu lado virou minha memória favorita.  
        Que sorte a nossa. Eu te amo infinitamente. 💖
    </p>
</div>

<div class="gallery">
    <img src="https://cdn.discordapp.com/attachments/1090851932463169649/1504234388999635114/IMG_1814.png?ex=6a063ef1&is=6a04ed71&hm=1dd3124ac6479e79c35180ec7c9f0192a9a0572f877ddf7db3a697b011239e1e&">

    <img src="https://cdn.discordapp.com/attachments/1090851932463169649/1504234114746683442/IMG_1812.png?ex=6a063eb0&is=6a04ed30&hm=9d171de0d5c47742ff555bd28f0e19ad7408c9ce553e062c8295f7cd5ee5c51d&">
   
</div>

<!-- Música -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/6Z66wVo7uNw?autoplay=1&loop=1&playlist=6Z66wVo7uNw">
</iframe>

<script>
const dataInicio = new Date("2026-04-20T00:37:00");

function atualizarContador() {
    const agora = new Date();

    let anos = agora.getFullYear() - dataInicio.getFullYear();
    let meses = agora.getMonth() - dataInicio.getMonth();
    let dias = agora.getDate() - dataInicio.getDate();

    if (dias < 0) {
        meses--;
        const ultimoMes = new Date(agora.getFullYear(), agora.getMonth(), 0);
        dias += ultimoMes.getDate();
    }

    if (meses < 0) {
        anos--;
        meses += 12;
    }

    const diferenca = agora - dataInicio;
    const segundos = Math.floor(diferenca / 1000) % 60;
    const minutos = Math.floor(diferenca / (1000 * 60)) % 60;
    const horas = Math.floor(diferenca / (1000 * 60 * 60)) % 24;

    document.getElementById("contador").innerHTML =
        anos + " anos, " +
        meses + " meses, " +
        dias + " dias 💕<br>" +
        horas + "h " +
        minutos + "m " +
        segundos + "s ❤️";
}

setInterval(atualizarContador, 1000);
atualizarContador();

/* CORAÇÕES */
function criarCoracao() {
    const coracao = document.createElement("div");
    coracao.classList.add("heart");
    coracao.innerHTML = "❤️";
    coracao.style.left = Math.random() * 100 + "vw";
    coracao.style.animationDuration = (Math.random() * 4 + 3) + "s";
    coracao.style.fontSize = (Math.random() * 15 + 15) + "px";
    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 7000);
}

setInterval(criarCoracao, 400);
</script>

</body>
</html>
    
  </body>
  
</html>
